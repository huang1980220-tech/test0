name: Auto Fetch News

on:
  schedule:
    # 每 30 分鐘自動執行一次
    - cron: '*/30 * * * *'
  workflow_dispatch: # 允許手動點擊按鈕立即測試

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v3

      - name: 設定 Python 環境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安裝必要套件
        run: |
          pip install feedparser google-generativeai

      - name: 執行新聞抓取腳本
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python fetch_news.py

      - name: 自動提交並更新新聞資料
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add news.json || true
          git commit -m "Auto update news.json" || true
          git push
