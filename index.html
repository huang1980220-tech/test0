<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>擊碎標題黨 NEWS</title>
<style>
  body { background: #0f1015; color: #fff; font-family: sans-serif; padding: 15px; max-width: 500px; margin: 0 auto; }
  header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 15px; }
  .logo { font-size: 18px; font-weight: bold; color: #ffbd59; }
  .card { background: #1a1b23; border: 1px solid #333; border-radius: 10px; padding: 15px; margin-bottom: 12px; display: block; text-decoration: none; color: white; }
  .source { font-size: 12px; color: #38ef7d; margin-bottom: 6px; }
  .title { font-size: 16px; font-weight: bold; line-height: 1.4; }
  .hint { font-size: 12px; color: #ffbd59; text-align: right; margin-top: 8px; }
</style>
</head>
<body>
  <header>
    <div class="logo">⚡ 擊碎標題黨 NEWS</div>
  </header>

  <div id="list">📡 載入中...</div>

<script>
  fetch('news.json?t=' + Date.now())
    .then(res => res.json())
    .then(data => {
      let html = '';
      data.forEach(item => {
        html += `
          <a class="card" href="${item.url}" target="_blank">
            <div class="source">📌 ${item.source} ｜ ${item.time}</div>
            <div class="title">${item.title}</div>
            <div class="hint">🔗 點擊閱讀新聞 ➔</div>
          </a>
        `;
      });
      document.getElementById('list').innerHTML = html;
    })
    .catch(err => {
      document.getElementById('list').innerHTML = '<div style="color:red;">載入失敗，請去 Actions 手動執行一次 Auto Fetch News。</div>';
    });
</script>
</body>
</html>
