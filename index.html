<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>擊碎標題黨 NEWS</title>
<style>
  :root {
    --bg-color: #0f1015;
    --card-bg: #1a1b23;
    --accent-color: #ffbd59;
    --text-primary: #ffffff;
    --text-secondary: #a0a5b5;
    --tag-bg: #282a36;
    --green-accent: #38ef7d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background-color: var(--bg-color);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif;
    padding: 12px;
    max-width: 500px;
    margin: 0 auto;
    padding-bottom: 40px;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 4px;
    margin-bottom: 12px;
    border-bottom: 1px solid #282933;
  }
  .logo { font-size: 18px; font-weight: 800; color: var(--accent-color); }
  .badge { font-size: 10px; background: #332200; color: var(--accent-color); padding: 2px 6px; border-radius: 4px; border: 1px solid var(--accent-color); }
  .news-card {
    background: var(--card-bg);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
    border: 1px solid #282933;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  }
  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    font-size: 12px;
  }
  .tag { background: var(--tag-bg); color: var(--green-accent); padding: 2px 8px; border-radius: 4px; font-weight: 600; }
  .source-time { color: var(--text-secondary); }
  .summary-text { font-size: 16px; line-height: 1.5; font-weight: 600; color: #ffffff; margin-bottom: 12px; }
  .bullet-container {
    background: #12131a;
    border-left: 3px solid var(--accent-color);
    padding: 10px 12px;
    border-radius: 0 8px 8px 0;
    font-size: 14px;
    line-height: 1.6;
    margin-bottom: 12px;
  }
  .link-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    padding: 8px 0;
    background: transparent;
    color: var(--accent-color);
    border: 1px solid var(--accent-color);
    border-radius: 8px;
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
  }
  .loading-box {
    text-align: center;
    padding: 30px;
    color: var(--text-secondary);
    font-size: 14px;
  }
</style>
</head>
<body>
  <header>
    <div class="logo">⚡ 擊碎標題黨 NEWS</div>
    <div class="badge">賢哥私人專屬版</div>
  </header>

  <div id="news-list">
    <div class="loading-box">📡 正在載入最新焦點新聞...</div>
  </div>

<script>
  // 備用測試資料（當雲端資料還沒更新時自動顯示）
  const fallbackData = [
    {
      cat: '消費',
      type: 'event',
      source: 'ETtoday',
      time: '即時焦點',
      summary: '📌 7-ELEVEn 於 8/18 推出 OPENPOINT APP 限定 1 元濃萃美式咖啡搶購活動。',
      url: 'https://tw.news.yahoo.com'
    },
    {
      cat: '生活',
      type: 'list',
      source: 'Yahoo新聞',
      time: '即時焦點',
      bullets: [
        '⚠️ <b>重點注意生肖</b>：屬鼠、蛇、猴、豬者。',
        '🚫 <b>重點禁忌</b>：半夜不曬衣服、不吹口哨、不去水邊與山區。'
      ],
      url: 'https://tw.news.yahoo.com'
    },
    {
      cat: '交通',
      type: 'event',
      source: '中央社',
      time: '即時焦點',
      summary: '📌 交通部宣布國道一號苗栗特定施工路段即日起速限降至 60 公里。',
      url: 'https://tw.news.yahoo.com'
    }
  ];

  // 渲染新聞卡片
  function renderNews(data) {
    const container = document.getElementById('news-list');
    container.innerHTML = '';
    
    data.forEach(item => {
      const card = document.createElement('div');
      card.className = 'news-card';
      
      let bodyContent = '';
      if (item.bullets && item.bullets.length > 0) {
        bodyContent = `<div class="bullet-container">${item.bullets.map(b => `<div>${b}</div>`).join('')}</div>`;
      } else {
        bodyContent = `<div class="summary-text">${item.summary || item.title}</div>`;
      }

      card.innerHTML = `
        <div class="card-header">
          <span class="tag">${item.cat || '焦點'}</span>
          <span class="source-time">${item.source || '即時新聞'} ｜ ${item.time || '剛剛'}</span>
        </div>
        ${bodyContent}
        <a href="${item.url || '#'}" target="_blank" class="link-btn">🔗 閱讀媒體原始報導</a>
      `;
      container.appendChild(card);
    });
  }

  // 嘗試讀取自動產生的新聞檔案，如果沒有就顯示預設資料
  fetch('news.json')
    ? fetch('news.json')
        .then(res => res.json())
        .then(data => renderNews(data))
        .catch(() => renderNews(fallbackData))
    : renderNews(fallbackData);
</script>
</body>
</html>
